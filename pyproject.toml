[project]
name = "gumlet"
version = "1.0.8" # x-release-please-version
description = "Gumlet helps developers deliver online video and images. This API encompasses Gumlet Video, Image and Video Analytics functionality to help you build your products better and faster than ever before."
readme = "README.md"
license = "Apache-2.0"
authors = [
  { name = "Gumlet", email = "support@gumlet.com"},
]
requires-python = ">= 3.9"
dependencies = [
  "httpx>=0.23.0, <1",
  "pydantic>=1.9.0, <3",
  "typing-extensions>=4.14, <5",
  "anyio>=3.5.0, <5",
  "distro>=1.7.0, <2",
  "sniffio",
]

keywords = ["gumlet", "api", "video"]

[project.urls]
homepage = "https://www.gumlet.com/"
source = "https://github.com/gumlet/python-sdk"
issues = "https://github.com/gumlet/python-sdk/issues"
changelog = "https://github.com/gumlet/python-sdk/blob/main/CHANGELOG.md"
documentation = "https://docs.gumlet.com/reference"

[project.optional-dependencies]
aiohttp = ["aiohttp", "httpx_aiohttp>=0.1.9"]

[build-system]
requires = ["hatchling>=1.18.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gumlet"]

[tool.ruff]
line-length = 120
